<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YellowGo Ride — Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{ --charcoal: #161512;
--white: #FFFCF5;
--yellow: #FFC93C;
--green: #0B6E4F;
--rust: #C4432B;
--line: #E8E1CF;
--muted: #8a8577;
--text: #161512;
}
*{box-sizing: border-box;
margin: 0;
padding: 0;
}
body{ font-family: 'Inter',sans-serif;
background: var(--charcoal);
color: var(--text);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}
.card{background: var(--white);
border-radius: 20px;
width: 100%;
max-width: 400px;
padding: 32px 28px;
}
h1{font-family: 'Sora',sans-serif;
font-size: 22px;
font-weight: 700;
margin-bottom: 6px;
}
p.sub{font-size: 13.5px;
color: var(--muted);
margin-bottom: 24px;
line-height: 1.5;
}
.field{margin-bottom: 16px;
}
.field label{display: block;
font-size: 12.5px;
font-weight: 600;
margin-bottom: 6px;
}
.field input{width: 100%;
padding: 12px 14px;
border: 1.5px solid var(--line);
border-radius: 10px;
font-size: 14px;
}
.field input:focus{outline: none;
border-color: var(--green);
box-shadow: 0 0 0 3px rgba(11,110,79,0.12);
}
.otp-input{text-align: center;
font-family: 'JetBrains Mono',monospace;
font-size: 22px;
letter-spacing: 6px;
}
.btn-primary{width: 100%;
padding: 13px 0;
background: var(--yellow);
color: var(--charcoal);
border: none;
border-radius: 10px;
font-family: 'Sora',sans-serif;
font-weight: 700;
font-size: 15px;
cursor: pointer;
}
.btn-primary:disabled{opacity: 0.55;
cursor: not-allowed;
}
.status-msg{margin-top: 14px;
padding: 10px 14px;
border-radius: 8px;
font-size: 13px;
display: none;
text-align: center;
}
.status-msg.error{display: block;
background: rgba(196,67,43,0.08);
color: var(--rust);
}
.status-msg.success{display: block;
background: rgba(11,110,79,0.08);
color: var(--green);
}
.resend-link{display: block;
text-align: center;
margin-top: 16px;
font-size: 13px;
color: var(--green);
cursor: pointer;
background: none;
border: none;
}
.resend-link:disabled{color: var(--muted);
cursor: not-allowed;
}
</style>
</head>
<body>
<div class="card">
<h1>Enter your code</h1>
<p class="sub">
We sent a 6-digit code to <strong id="phone-display">your phone</strong>. It expires in 5 minutes.
</p>

<div class="field">
<label for="otp-input">Verification code</label>
<input type="text" id="otp-input" class="otp-input" maxlength="6" inputmode="numeric" placeholder="000000" />
</div>

<div class="field">
<label for="new-password">New password</label>
<input type="password" id="new-password" placeholder="At least 6 characters" autocomplete="new-password" />
</div>
<div class="field">
<label for="confirm-password">Confirm new password</label>
<input type="password" id="confirm-password" placeholder="Re-enter password" autocomplete="new-password" />
</div>

<button class="btn-primary" id="reset-btn">Reset Password</button>
<div class="status-msg" id="status"></div>
<button class="resend-link" id="resend-btn">Didn't get a code? Resend</button>
</div>

<script>
// reset-password.html
// smooth-endpoint = your verify-otp function
// clever-responder = your request-otp function
const VERIFY_OTP_URL  = "https://ygdydzwhtcfuoedyxvjb.supabase.co/functions/v1/smooth-endpoint";
const REQUEST_OTP_URL =
"https://ygdydzwhtcfuoedyxvjb.supabase.co/functions/v1/clever-responder";

const params = new URLSearchParams(window.location.search);
const phone = params.get('phone');
if (phone){ document.getElementById('phone-display').textContent = phone; } else { window.location.href = 'forgot-password.html'; }

document.getElementById('reset-btn').addEventListener('click', async () => {
const btn = document.getElementById('reset-btn');
const statusEl = document.getElementById('status');
const otp = document.getElementById('otp-input').value.trim();
const newPassword = document.getElementById('new-password').value;
const confirmPassword = document.getElementById('confirm-password').value;

if (!otp || otp.length !== 6){ statusEl.className = 'status-msg error'; statusEl.textContent = 'Enter the 6-digit code.'; return; }
if (newPassword.length < 6){ statusEl.className = 'status-msg error'; statusEl.textContent = 'Password must be at least 6 characters.'; return; }
if (newPassword !== confirmPassword){ statusEl.className = 'status-msg error'; statusEl.textContent = 'Passwords do not match.'; return; }

btn.disabled = true; btn.textContent = 'Resetting…';

try{
const res = await fetch(VERIFY_OTP_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ phone_number: phone, otp, new_password: newPassword })
});
const data = await res.json();

btn.disabled = false; btn.textContent = 'Reset Password';

if (data.success){
statusEl.className = 'status-msg success';
statusEl.textContent = 'Password updated! Redirecting to login…';
setTimeout(() => window.location.href = 'login.html', 1500);
} else {
statusEl.className = 'status-msg error';
statusEl.textContent = data.error || 'Something went wrong.';
}
} catch(err){
btn.disabled = false; btn.textContent = 'Reset Password';
statusEl.className = 'status-msg error';
statusEl.textContent = 'Network error. Please try again.';
}
});

document.getElementById('resend-btn').addEventListener('click', async () => {
const btn = document.getElementById('resend-btn');
const statusEl = document.getElementById('status');
btn.disabled = true; btn.textContent = 'Sending…';

try{
const res = await fetch(REQUEST_OTP_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ phone_number: phone })
});
const data = await res.json();
statusEl.className = data.success ? 'status-msg success': 'status-msg error';
statusEl.textContent = data.success ? 'New code sent!': (data.error || 'Could not resend.');
} catch(err){
statusEl.className = 'status-msg error';
statusEl.textContent = 'Network error.';
}
btn.disabled = false; btn.textContent = "Didn't get a code? Resend";
});
</script>
</body>
</html>
