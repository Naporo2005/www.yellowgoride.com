<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YellowGo Ride — Forgot Password</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{ --charcoal: #161512;
--white: #FFFCF5;
--yellow: #FFC93C;
--green: #0B6E4F;
--rust: #C4432B;
--line: #E8E1CF;
--muted: #8a8577;
--text: #161512;
}
*{box-sizing: border-box;
margin: 0;
padding: 0;
}
body{ font-family: 'Inter',sans-serif;
background: var(--charcoal);
color: var(--text);
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 20px;
}
.card{background: var(--white);
border-radius: 20px;
width: 100%;
max-width: 400px;
padding: 32px 28px;
}
h1{font-family: 'Sora',sans-serif;
font-size: 22px;
font-weight: 700;
margin-bottom: 6px;
}
p.sub{font-size: 13.5px;
color: var(--muted);
margin-bottom: 24px;
line-height: 1.5;
}
.field{margin-bottom: 16px;
}
.field label{display: block;
font-size: 12.5px;
font-weight: 600;
margin-bottom: 6px;
}
.field input{width: 100%;
padding: 12px 14px;
border: 1.5px solid var(--line);
border-radius: 10px;
font-size: 14px;
}
.field input:focus{outline: none;
border-color: var(--green);
box-shadow: 0 0 0 3px rgba(11,110,79,0.12);
}
.btn-primary{width: 100%;
padding: 13px 0;
background: var(--yellow);
color: var(--charcoal);
border: none;
border-radius: 10px;
font-family: 'Sora',sans-serif;
font-weight: 700;
font-size: 15px;
cursor: pointer;
}
.btn-primary:disabled{opacity: 0.55;
cursor: not-allowed;
}
.status-msg{
margin-top: 14px;
margin-bottom: 4px;
padding: 10px 14px;
border-radius: 8px;
font-size: 13px;
display: none;
text-align: center;
}
.status-msg.error{display: block;
background: rgba(196,67,43,0.08);
color: var(--rust);
}
.status-msg.success{display: block;
background: rgba(11,110,79,0.08);
color: var(--green);
}
.back-link{display: block;
text-align: center;
margin-top: 16px;
font-size: 13px;
color: var(--muted);
text-decoration: none;
}
</style>
</head>
<body>
<div class="card">
<h1>Forgot your password?</h1>
<p class="sub">
Enter your phone number. You will receive a SMS  of a 6-digit code.
</p>

<div class="field">
<label for="phone-input">Phone number</label>
<input type="tel" id="phone-input" placeholder="e.g. 0555358325" autocomplete="tel" />
</div>

<div class="status-msg" id="status"></div>
<button class="btn-primary" id="send-otp-btn">Send Code</button>
<a href="login.html" class="back-link">← Back to login</a>
</div>

<script src="supabase-config.js"></script>
<script>
// forgot-password.html
// clever-responder = your request-otp function (generates + sends the code)
const REQUEST_OTP_URL =
"https://ygdydzwhtcfuoedyxvjb.supabase.co/functions/v1/clever-responder";

document.getElementById('send-otp-btn').addEventListener('click', async () => {
const btn = document.getElementById('send-otp-btn');
const statusEl = document.getElementById('status');
const phone = document.getElementById('phone-input').value.trim();

if (!phone){ statusEl.className = 'status-msg error'; statusEl.textContent = 'Enter your phone number.'; return; }

btn.disabled = true; btn.textContent = 'Sending…';

try{
const res = await fetch(REQUEST_OTP_URL, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ phone_number: phone })
});
const data = await res.json();

btn.disabled = false; btn.textContent = 'Send Code';

if (data.success){
statusEl.className = 'status-msg success';
statusEl.textContent = 'Code sent!';
setTimeout(() => {
window.location.href = `reset-password.html?phone=${encodeURIComponent(phone)}`;
}, 1000);
} else {
statusEl.className = 'status-msg error';
statusEl.textContent = data.error || 'Something went wrong. Please try again.';
}
} catch(err){
btn.disabled = false; btn.textContent = 'Send Code';
statusEl.className = 'status-msg error';
statusEl.textContent = 'Network error. Please try again.';
}
});
</script>
</body>
</html>
